/api/v1/maestras/departamentos:
  get:
    tags:
      - Maestras
    description: Obtener la lista de departamentos disponibles
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Lista de departamentos obtenida exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                respuestaDepartamentos:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Identificador del departamento
                      codigoDepartamento:
                        type: string
                        description: Código del departamento
                      nombre:
                        type: string
                        description: Nombre del departamento
      '401':
        description: No autorizado
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  description: Mensaje de error de autorización
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  description: Mensaje de error interno
