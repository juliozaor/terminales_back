/api/v1/terminales/visualizar-rutas:
  get:
    tags:
      - Rutas
    description: Obtener rutas paginadas para el usuario autenticado
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Rutas obtenidas exitosamente
        content:
          application/json:
            schema:
              type: object
              properties:
                rutas:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Identificador de la ruta
                      id_ruta:
                        type: integer
                        description: ID de la ruta
                      id_unico_ruta:
                        type: integer
                        description: ID único de la ruta
                      departamento_origen:
                        type: string
                        description: Nombre del departamento de origen
                      departamento_origen_codigo:
                        type: string
                        description: Código del departamento de origen
                      municipio_origen:
                        type: string
                        description: Nombre del municipio de origen
                      municipio_origen_codigo:
                        type: string
                        description: Código del municipio de origen
                      cp_origen:
                        type: string
                        description: Nombre del centro poblado de origen
                      cp_origen_codigo:
                        type: string
                        description: Código del centro poblado de origen
                      departamento_destino:
                        type: string
                        description: Nombre del departamento de destino
                      departamento_destino_codigo:
                        type: string
                        description: Código del departamento de destino
                      municipio_destino:
                        type: string
                        description: Nombre del municipio de destino
                      municipio_destino_codigo:
                        type: string
                        description: Código del municipio de destino
                      cp_destino:
                        type: string
                        description: Nombre del centro poblado de destino
                      cp_destino_codigo:
                        type: string
                        description: Código del centro poblado de destino
                      tipo_llegada:
                        type: string
                        description: Tipo de llegada
                      tipo_llegada_id:
                        type: integer
                        description: ID del tipo de llegada
                      direccion:
                        type: string
                        description: Dirección de la ruta
                      direccion_id:
                        type: integer
                        description: ID de la dirección
                      via:
                        type: string
                        description: Vía de la ruta
                      estado:
                        type: boolean
                        description: Estado de la ruta (activa o inactiva)
                      resolucion:
                        type: string
                        description: Resolución asociada a la ruta
                      corresponde:
                        type: integer
                        description: Indica si corresponde (1- sí, 0- no)
                      resolucion_actual:
                        type: string
                        description: Resolución actual de la ruta
                      direccion_territorial:
                        type: string
                        description: Dirección territorial de la ruta
                      documento:
                        type: string
                        description: Nombre del documento asociado
                      nombre_original:
                        type: string
                        description: Nombre original del archivo
                      ruta_archivo:
                        type: string
                        description: Ruta del archivo en el servidor
                paginacion:
                  type: object
                  properties:
                    totalRegistros:
                      type: string
                      description: Total de registros de rutas
                    totalPaginas:
                      type: string
                      nullable: true
                      description: Total de páginas disponibles
      '401':
        description: No autorizado
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  description: Mensaje de error de autorización
      '500':
        description: Error interno del servidor
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  description: Mensaje de error interno
